<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-label="Araneta City">
  <title>Araneta City</title>

  <!-- Everything is drawn inside a padded 1000x1000 area centred in a
       1200x1200 viewBox, so there is a safe margin on all sides and the
       artwork never touches the edge of a circular container. -->
  <g transform="translate(100,120)">

    <!-- ===== Symbol ===== -->
    <!-- Outer ring, left half: PURPLE -->
    <path fill="#8f2d8f"
          d="M420 120
             A280 280 0 0 0 420 680
             L420 540
             A140 140 0 0 1 420 260
             Z"/>

    <!-- Outer ring, right half + angled tail: RED -->
    <path fill="#ed1c2e"
          d="M420 120
             A280 280 0 0 1 650 240
             L650 540
             L720 670
             L545 670
             A280 280 0 0 1 420 680
             L420 540
             A140 140 0 0 0 420 260
             Z"/>

    <!-- Inner counter, left half: TEAL -->
    <path fill="#009b9b"
          d="M420 260
             A140 140 0 0 0 420 540
             Z"/>

    <!-- Green divider bar -->
    <rect fill="#7ab648" x="420" y="262" width="80" height="278"/>

    <!-- ===== Wordmark ===== -->
    <text x="400" y="860"
          font-family="'Century Gothic','Futura','Segoe UI',Verdana,sans-serif"
          font-size="185" font-weight="500" letter-spacing="-3"
          text-anchor="middle" fill="#009b9b">araneta city</text>
  </g>
</svg>
